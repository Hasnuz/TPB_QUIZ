<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Perfume Bar Dubai — Scent Family Quiz</title>

<style>
:root{
  --gold:#c49a5a;
  --gold-dark:#a77b3d;
  --cream:#f8f5ef;
  --paper:#fffdf9;
  --ink:#25211d;
  --muted:#82796d;
  --line:#e7ded0;
  --soft:#f3eee5;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--cream);
}

body{
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
  -webkit-tap-highlight-color:transparent;
}

button{font:inherit}

.app{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:28px;
}

.shell{
  width:min(1080px,100%);
  min-height:min(820px,calc(100vh - 56px));
  background:var(--paper);
  border:1px solid var(--line);
  box-shadow:0 25px 80px rgba(60,45,25,.12);
  position:relative;
  overflow:hidden;
}

.shell:before,
.shell:after{
  content:"";
  position:absolute;
  width:190px;
  height:190px;
  border:1px solid rgba(196,154,90,.16);
  border-radius:50%;
  pointer-events:none;
}

.shell:before{
  left:-120px;
  top:-120px;
}

.shell:after{
  right:-120px;
  bottom:-120px;
}


/* HEADER */

.header{
  padding:22px 42px 15px;
  border-bottom:1px solid var(--line);
  position:relative;
  z-index:2;
}

.brand{
  display:flex;
  justify-content:center;
  align-items:center;
}

.brand img{
  width:185px;
  height:auto;
  display:block;
  mix-blend-mode:multiply;
}

.topline{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:8px;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
}

.progress{
  height:3px;
  background:#eee8de;
  margin:0 42px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:var(--gold);
  transition:width .4s ease;
}


/* SCREEN */

.screen{
  min-height:650px;
  padding:52px 72px 40px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  position:relative;
  z-index:1;
}


/* INTRO */

.intro{
  text-align:center;
  max-width:760px;
  margin:auto;
}

.kicker{
  color:var(--gold-dark);
  text-transform:uppercase;
  letter-spacing:.28em;
  font-size:11px;
  font-weight:700;
}

h1,h2{
  font-family:Georgia,"Times New Roman",serif;
  font-weight:400;
}

.intro h1{
  font-size:52px;
  line-height:1.05;
  margin:26px 0 26px;
}

.intro p{
  max-width:620px;
  margin:0 auto 34px;
  color:var(--muted);
  font-size:16px;
  line-height:1.7;
}

.start-btn,
.restart-btn{
  border:1px solid var(--gold-dark);
  background:var(--gold-dark);
  color:white;
  padding:20px 44px;
  min-width:280px;
  cursor:pointer;
  letter-spacing:.12em;
  font-size:12px;
  transition:.2s;
}

.start-btn:hover,
.restart-btn:hover{
  background:#8e662f;
}

.small-note{
  margin-top:18px!important;
  font-size:11px!important;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#aaa095!important;
}


/* QUIZ */

.quiz{
  display:none;
}

.question-head{
  text-align:center;
  max-width:800px;
  margin:0 auto 34px;
}

.question-head h2{
  font-size:40px;
  line-height:1.18;
  margin:12px 0 10px;
}

.question-head p{
  margin:0;
  color:var(--muted);
  font-size:14px;
}

.answers{
  width:min(820px,100%);
  margin:0 auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.answer{
  border:1px solid var(--line);
  background:#fff;
  min-height:106px;
  padding:20px 22px;
  display:flex;
  align-items:center;
  gap:17px;
  text-align:left;
  cursor:pointer;
  color:var(--ink);
  transition:.2s ease;
}

.answer:hover{
  border-color:var(--gold);
  transform:translateY(-2px);
  box-shadow:0 10px 28px rgba(60,45,25,.08);
}

.answer:active{
  transform:scale(.99);
}

.answer-number{
  width:38px;
  height:38px;
  border:1px solid #d8c5a8;
  border-radius:50%;
  display:grid;
  place-items:center;
  flex:0 0 38px;
  color:var(--gold-dark);
  font-family:Georgia,serif;
}

.answer-text{
  font-family:Georgia,"Times New Roman",serif;
  font-size:17px;
  line-height:1.35;
}


/* FOOTER */

.footer{
  text-align:center;
  padding:0 25px 25px;
  color:#aaa095;
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
}


/* RESULT — ORIGINAL DESIGN KEPT */

.result{
  display:none;
  position:relative;
  overflow:hidden;
  text-align:center;
  background:
    radial-gradient(circle at 50% 28%,rgba(196,154,90,.12),transparent 30%),
    linear-gradient(180deg,#fffdf9 0%,#f8f3ea 100%);
}

.result:before,
.result:after{
  content:"";
  position:absolute;
  border:1px solid rgba(196,154,90,.16);
  border-radius:50%;
  pointer-events:none;
}

.result:before{
  width:430px;
  height:430px;
  top:-260px;
  left:-180px;
}

.result:after{
  width:520px;
  height:520px;
  right:-260px;
  bottom:-330px;
}

.result-wrap{
  width:min(760px,100%);
  margin:auto;
  position:relative;
  z-index:2;
}

.reveal-kicker{
  color:var(--gold-dark);
  text-transform:uppercase;
  letter-spacing:.32em;
  font-size:10px;
  font-weight:700;
  margin-bottom:24px;
}

.reveal-mark{
  width:96px;
  height:96px;
  margin:0 auto 26px;
  border:1px solid rgba(196,154,90,.55);
  border-radius:50%;
  display:grid;
  place-items:center;
  position:relative;
}

.reveal-mark:before{
  content:"";
  position:absolute;
  inset:8px;
  border:1px solid rgba(196,154,90,.20);
  border-radius:50%;
}

.result-icon{
  width:58px;
  height:58px;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:var(--gold-dark);
  background:rgba(255,255,255,.72);
  font-family:Georgia,serif;
  font-size:28px;
  box-shadow:0 12px 30px rgba(83,58,24,.08);
}

.result-family{
  color:#9c8d79;
  font-size:10px;
  font-weight:700;
  letter-spacing:.28em;
  text-transform:uppercase;
  margin-bottom:10px;
}

.result h2{
  font-size:72px;
  line-height:.98;
  margin:0;
  color:var(--ink);
  letter-spacing:-.025em;
}

.result-tagline{
  margin:16px auto 0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:18px;
  font-style:italic;
  color:var(--gold-dark);
}

.result-line{
  width:80px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  margin:27px auto 24px;
}

.result p{
  max-width:610px;
  color:var(--muted);
  line-height:1.85;
  font-size:15px;
  margin:0 auto 27px;
}

.result-traits{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin:0 auto 28px;
}

.result-trait{
  padding:9px 14px;
  border:1px solid #dfd3c2;
  background:rgba(255,255,255,.62);
  color:#665b4f;
  font-size:9px;
  letter-spacing:.15em;
  text-transform:uppercase;
}

.result-hint{
  max-width:560px;
  margin:0 auto 26px;
  padding-top:18px;
  border-top:1px solid rgba(196,154,90,.22);
  font-family:Georgia,"Times New Roman",serif;
  font-size:15px;
  color:#51483e;
}

.result .restart-btn{
  min-width:220px;
  box-shadow:0 10px 26px rgba(112,78,33,.13);
}


/* BACK BUTTON */

.back-row{
  width:min(820px,100%);
  margin:20px auto 0;
  display:flex;
  justify-content:flex-start;
}

.back-btn{
  border:1px solid var(--line);
  background:transparent;
  color:var(--muted);
  padding:11px 20px;
  cursor:pointer;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  transition:.2s;
}

.back-btn:hover{
  border-color:var(--gold);
  color:var(--gold-dark);
  background:var(--soft);
}


/* MOBILE */

@media(max-width:760px){

  .app{
    padding:0;
  }

  .shell{
    min-height:100vh;
    border:0;
    box-shadow:none;
  }

  .header{
    padding:17px 20px 12px;
  }

  .brand img{
    width:145px;
  }

  .topline{
    font-size:9px;
  }

  .progress{
    margin:0 20px;
  }

  .screen{
    padding:38px 20px 25px;
    min-height:calc(100vh - 120px);
  }

  .intro h1{
    font-size:39px;
  }

  .question-head h2{
    font-size:30px;
  }

  .answers{
    grid-template-columns:1fr;
    gap:11px;
  }

  .answer{
    min-height:78px;
    padding:15px 17px;
  }

  .answer-text{
    font-size:15px;
  }

  .answer-number{
    width:32px;
    height:32px;
    flex-basis:32px;
  }

  .result h2{
    font-size:48px;
  }

  .reveal-mark{
    width:82px;
    height:82px;
    margin-bottom:20px;
  }

  .result-icon{
    width:50px;
    height:50px;
    font-size:24px;
  }

  .result-tagline{
    font-size:16px;
  }

  .result p{
    font-size:14px;
    line-height:1.7;
  }

  .result-trait{
    padding:8px 10px;
    font-size:8px;
  }
}

</style>
</head>


<body>

<div class="app">
  <main class="shell">

    <!-- HEADER -->
    <header class="header">

      <div class="brand">
        <img src="assets/LOGO_TPB.png" alt="The Perfume Bar">
      </div>

      <div class="topline">
        <span>The Perfume Bar · Dubai</span>
        <span id="counter">Scent Discovery</span>
      </div>

    </header>


    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>


    <!-- INTRO -->
    <section class="screen intro" id="introScreen">

      <div class="intro">

        <div class="kicker">
          A Personal Fragrance Discovery
        </div>

        <h1>
          Discover Your
          Scent Family
        </h1>

        <!-- <p>
          Answer ten simple questions based on your mood, style and personality.
          At the end, we'll reveal the fragrance family that feels most like you.
        </p> -->

        <button class="start-btn" onclick="startQuiz()">
          BEGIN DISCOVERY
        </button>

        <!-- <p class="small-note">
          There are no right or wrong answers · Trust your instinct
        </p> -->

      </div>

    </section>


    <!-- QUIZ -->
    <section class="screen quiz" id="quizScreen">

      <div class="question-head">

        <div class="kicker" id="questionKicker">
          Question 1
        </div>

        <h2 id="questionText"></h2>

        <p id="questionSub"></p>

      </div>


      <div class="answers" id="answers"></div>


      <div class="back-row" id="backRow" style="display:none;">

        <button class="back-btn" onclick="goBack()">
          ← Back
        </button>

      </div>

    </section>


    <!-- RESULT — SAME DESIGN -->
    <section class="screen result" id="resultScreen">

      <div class="result-wrap">

        <!-- <div class="reveal-kicker">
          The Perfume Bar · Scent Discovery
        </div> -->

       

        <div class="result-family">
          Your Fragrance Family Is
        </div>

        <h2 id="resultName"></h2>

        <div class="result-tagline" id="resultTagline"></div>

        <div class="result-line"></div>

        <p id="resultDescription"></p>

        <div class="result-traits" id="resultTraits"></div>

        <div class="result-hint" id="resultHint"></div>

        <button class="restart-btn" onclick="restartQuiz()">
          DISCOVER ANOTHER SCENT
        </button>

      </div>

    </section>


    

  </main>
</div>


<script>

const questions = [

  {
    question:"What kind of atmosphere instantly attracts you?",
    sub:"Choose the mood you would naturally gravitate toward.",
    answers:[
      ["A","Warm, mysterious and luxurious","Oud"],
      ["B","Clean, airy and refreshing","Fresh"],
      ["C","Soft, intimate and comforting","Musk"],
      ["D","Bright, lively and energetic","Citrus & Spicy"]
    ]
  },

  {
    question:"Choose your ideal evening.",
    sub:"Imagine yourself there — which scene feels most like you?",
    answers:[
      ["A","A candlelit lounge with dark wood","Oud"],
      ["B","A beautiful dinner surrounded by golden light","Amber"],
      ["C","A cozy evening with vanilla and dessert","Sweet"],
      ["D","A seaside terrace with a cool breeze","Fresh"]
    ]
  },

  {
    question:"What impression would you love your fragrance to leave?",
    sub:"Think about how you want people to remember you.",
    answers:[
      ["A","Sophisticated and unforgettable","Oud"],
      ["B","Soft, sensual and quietly captivating","Musk"],
      ["C","Elegant, warm and magnetic","Amber"],
      ["D","Fun, vibrant and full of energy","Citrus & Spicy"]
    ]
  },

  {
    question:"Which fragrance mood sounds most appealing?",
    sub:"Don't overthink it. Pick the description you can picture wearing.",
    answers:[
      ["A","Crisp, clean and effortlessly fresh","Fresh"],
      ["B","Creamy, delicious and addictive","Sweet"],
      ["C","Deep, powerful and distinctive","Oud"],
      ["D","Warm, rich and enveloping","Amber"]
    ]
  },

  {
    question:"Choose a texture for your dream scent.",
    sub:"Which one feels closest to your personal style?",
    answers:[
      ["A","Soft cashmere","Musk"],
      ["B","Warm satin","Amber"],
      ["C","Sparkling citrus peel with warm spice","Citrus & Spicy"],
      ["D","Velvety vanilla cream","Sweet"]
    ]
  },

  {
    question:"If your fragrance had a personality, what would it be?",
    sub:"Pick the personality you would most enjoy wearing.",
    answers:[
      ["A","Confident and mysterious","Oud"],
      ["B","Fresh and carefree","Fresh"],
      ["C","Elegant and magnetic","Amber"],
      ["D","Charming and irresistible","Sweet"]
    ]
  },

  {
    question:"Which setting feels most like your personal style?",
    sub:"Picture yourself in your favorite environment.",
    answers:[
      ["A","A luxurious majlis with rich woods","Oud"],
      ["B","A bright garden after the rain","Fresh"],
      ["C","A quiet room with soft fabrics and warm skin","Musk"],
      ["D","A glamorous evening surrounded by golden details","Amber"]
    ]
  },

  {
    question:"What kind of opening would make you want to keep smelling a fragrance?",
    sub:"Choose the first impression that excites you most.",
    answers:[
      ["A","Juicy and sparkling","Citrus & Spicy"],
      ["B","Warm and resinous","Amber"],
      ["C","Creamy and mouth-watering","Sweet"],
      ["D","Deep and woody","Oud"]
    ]
  },

  {
    question:"When choosing a signature scent, what matters most?",
    sub:"Select the quality you would want to notice every time you wear it.",
    answers:[
      ["A","A clean feeling that lasts","Fresh"],
      ["B","A soft, sensual trail","Musk"],
      ["C","A rich and luxurious presence","Amber"],
      ["D","A bold character people remember","Oud"]
    ]
  },

  {
    question:"Which final mood would you love your fragrance to create?",
    sub:"Trust your instinct — this is your final choice.",
    answers:[
      ["A","Playful, delicious and irresistible","Sweet"],
      ["B","Energetic, sparkling and bold","Citrus & Spicy"],
      ["C","Soft, intimate and sensual","Musk"],
      ["D","Fresh, bright and effortlessly elegant","Fresh"]
    ]
  }

];


const descriptions = {

  "Oud":
    "You are drawn to depth, character and presence. Oud fragrances feel sophisticated, distinctive and memorable — a signature for someone who likes to make an impression.",

  "Fresh":
    "You naturally gravitate toward clean, bright and effortless scents. Fresh fragrances feel uplifting, modern and easy to wear — fresh energy with a polished finish.",

  "Musk":
    "You prefer intimacy over intensity. Musk fragrances are soft, sensual and comforting, creating a beautiful scent that feels personal and close to the skin.",

  "Amber":
    "You love warmth, elegance and richness. Amber fragrances surround you with a luxurious glow and a magnetic presence that feels timeless.",

  "Sweet":
    "You have a playful and irresistible side. Sweet fragrances are creamy, delicious and comforting, with a character that people naturally want to come closer to.",

  "Citrus & Spicy":
    "You like energy and expression. Citrus & Spicy fragrances feel vibrant, sparkling and bold — perfect for someone who brings life into every room."

};


const resultDetails = {

  "Oud":{
    tagline:"Deep · Refined · Unforgettable",
    traits:["Woody","Smoky","Rich","Mysterious"],
    icon:"✦"
  },

  "Fresh":{
    tagline:"Clean · Bright · Effortless",
    traits:["Crisp","Airy","Uplifting","Modern"],
    icon:"✧"
  },

  "Musk":{
    tagline:"Soft · Intimate · Sensual",
    traits:["Velvety","Clean","Comforting","Skin-like"],
    icon:"◇"
  },

  "Amber":{
    tagline:"Warm · Rich · Magnetic",
    traits:["Golden","Warm","Resinous","Elegant"],
    icon:"◆"
  },

  "Sweet":{
    tagline:"Playful · Creamy · Irresistible",
    traits:["Gourmand","Creamy","Cozy","Addictive"],
    icon:"✦"
  },

  "Citrus & Spicy":{
    tagline:"Vibrant · Sparkling · Bold",
    traits:["Zesty","Spiced","Energetic","Bright"],
    icon:"✧"
  }

};


let currentQuestion = 0;

let selectedFamilies = [];

let scores = {
  "Oud":0,
  "Fresh":0,
  "Musk":0,
  "Amber":0,
  "Sweet":0,
  "Citrus & Spicy":0
};


function startQuiz(){

  document.getElementById("introScreen").style.display="none";

  document.getElementById("resultScreen").style.display="none";

  document.getElementById("quizScreen").style.display="flex";

  currentQuestion=0;

  selectedFamilies=[];

  resetScores();

  renderQuestion();

}


function resetScores(){

  Object.keys(scores).forEach(key => scores[key]=0);

}


function renderQuestion(){

  const q=questions[currentQuestion];


  document.getElementById("counter").textContent =
    `Question ${currentQuestion+1} of ${questions.length}`;


  document.getElementById("questionKicker").textContent =
    `Question ${currentQuestion+1} of ${questions.length}`;


  document.getElementById("questionText").textContent=q.question;


  document.getElementById("questionSub").textContent=q.sub;


  document.getElementById("progressBar").style.width =
    `${((currentQuestion)/questions.length)*100}%`;


  const answers=document.getElementById("answers");

  answers.innerHTML="";


  document.getElementById("backRow").style.display =
    currentQuestion > 0 ? "flex" : "none";


  q.answers.forEach(answer=>{

    const button=document.createElement("button");

    button.className="answer";

    button.innerHTML=`
      <span class="answer-number">${answer[0]}</span>
      <span class="answer-text">${answer[1]}</span>
    `;

    button.onclick=()=>selectAnswer(answer[2]);

    answers.appendChild(button);

  });

}


function selectAnswer(family){

  selectedFamilies[currentQuestion]=family;

  scores[family]++;

  currentQuestion++;


  if(currentQuestion < questions.length){

    renderQuestion();

  }else{

    showResult();

  }

}


function goBack(){

  if(currentQuestion <= 0) return;


  currentQuestion--;


  const previousFamily =
    selectedFamilies[currentQuestion];


  if(previousFamily){

    scores[previousFamily]--;

  }


  selectedFamilies[currentQuestion]=null;


  renderQuestion();

}


/* FIXED RESULT LOGIC */
function showResult(){

  document.getElementById("quizScreen").style.display="none";

  document.getElementById("resultScreen").style.display="flex";

  document.getElementById("progressBar").style.width="100%";

  document.getElementById("counter").textContent="Your Scent Family";


  const maxScore =
    Math.max(...Object.values(scores));


  const winners =
    Object.keys(scores).filter(
      family => scores[family] === maxScore
    );


  let winner =
    winners[0];


  /*
    TIE BREAKER

    If 2 or more families have the same score,
    go through the customer's REAL selections
    from the last question backwards.

    The most recently selected family among
    the tied families becomes the result.
  */

  if(winners.length > 1){

    for(
      let i=selectedFamilies.length-1;
      i>=0;
      i--
    ){

      const selectedFamily =
        selectedFamilies[i];


      if(winners.includes(selectedFamily)){

        winner =
          selectedFamily;

        break;

      }

    }

  }


  const detail =
    resultDetails[winner];


  document.getElementById("resultName").textContent =
    winner;


  document.getElementById("resultDescription").textContent =
    descriptions[winner];


  document.getElementById("resultTagline").textContent =
    detail.tagline;


  document.getElementById("resultIcon").textContent =
    detail.icon;


  document.getElementById("resultHint").textContent =
    "Let our fragrance specialist introduce you to scents from the " +
    winner +
    " family.";


  const traits =
    document.getElementById("resultTraits");


  traits.innerHTML="";


  detail.traits.forEach(item=>{

    const el =
      document.createElement("span");


    el.className =
      "result-trait";


    el.textContent =
      item;


    traits.appendChild(el);

  });

}


function restartQuiz(){

  document.getElementById("resultScreen").style.display="none";

  document.getElementById("quizScreen").style.display="none";

  document.getElementById("introScreen").style.display="flex";

  document.getElementById("progressBar").style.width="0%";

  document.getElementById("counter").textContent="Scent Discovery";


  currentQuestion=0;

  resetScores();

  selectedFamilies=[];

}

</script>

</body>
</html>
